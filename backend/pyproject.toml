[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "person-search-backend"
version = "0.1.0"
description = "Flask API for the camera-based person search capstone project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14,<17",
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "Flask>=3.1",
    "cryptography>=44",
    "minio>=7.2,<8",
    "Pillow>=11,<13",
    "psycopg[binary]>=3.2,<4",
    "pymilvus>=2.6,<2.7",
    "python-dotenv>=1.1,<2",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
ai-ultralytics = [
    "lap==0.5.12",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "ultralytics==8.4.163",
]
ai-rasa = [
    "safetensors==0.4.5",
    "timm==0.9.16",
    "transformers==4.49.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[project.scripts]
person-search-api = "person_search.__main__:main"
person-search-worker = "person_search.workers.main:main"
person-search-production-worker = "person_search.workers.production_main:main"
person-search-seed = "person_search.storage.postgres.seed:main"
person-search-user = "person_search.auth.cli:main"
person-search-storage = "person_search.storage.maintenance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: fast tests without external services",
    "contract: API request and response contract tests",
    "integration: tests requiring external storage services",
    "security: authentication and authorization security tests",
    "e2e: end-to-end workflow tests",
    "model_real(modules, artifacts): requires optional AI packages or local model artifacts",
    "failure_injection: fault injection across worker, pipeline and storage boundaries",
]

[tool.coverage.run]
branch = true
source = ["person_search"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/person_search/ai/encoders/rasa_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
